name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（必须已存在）'
        required: true
        default: 'v1.0.40.rc'
      prerelease:
        description: '标记为预发布'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build_type: [debug, release]
        abi: [split, universal]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 删除 Gradle 守护进程 JDK 配置
        run: |
          if [ -f "gradle/gradle-daemon-jvm.properties" ]; then
            rm -f gradle/gradle-daemon-jvm.properties
          fi

      - name: 授予 Gradle 执行权限
        run: chmod +x gradlew

      - name: 调整 Gradle 内存（CI 机器内存有限）
        run: |
          sed -i 's/-Xmx[0-9]\+g/-Xmx4g/g' gradle.properties
          sed -i 's/-XX:MaxMetaspaceSize=[0-9]\+g/-XX:MaxMetaspaceSize=1g/g' gradle.properties

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 解码签名密钥
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > "$GITHUB_WORKSPACE/release.jks"

      - name: 组装 ABI 参数
        id: abi
        run: |
          if [ "${{ matrix.abi }}" = "universal" ]; then
            echo "list=universal" >> "$GITHUB_OUTPUT"
          else
            echo "list=arm64-v8a,armeabi-v7a,x86_64,x86" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建 ${{ matrix.build_type }}（${{ matrix.abi }}）
        run: |
          TYPE="${{ matrix.build_type }}"
          CAP="$(echo "${TYPE:0:1}" | tr a-z A-Z)${TYPE:1}"
          ./gradlew ":lyricon:assemble${CAP}" -PABI_LIST="${{ steps.abi.outputs.list }}"
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: lyricon-${{ matrix.build_type }}-${{ matrix.abi }}
          path: build/all-apks/${{ matrix.build_type }}/*.apk
          if-no-files-found: error

      - name: 清理敏感文件
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.jks"

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 列出待发布文件
        run: |
          find artifacts -name '*.apk' | sort
          echo "共 $(find artifacts -name '*.apk' | wc -l) 个 APK"

      - name: 创建 Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Lyricon ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: artifacts/**/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(github.ref_name, 'rc') }}
